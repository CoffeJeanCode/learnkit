name: CI

# Verifies every pull request to main and every merge into main. It never
# publishes anything: releases stay in release.yml (tag `v*` or manual run), so
# a PR or a merge can't ship an update to users by accident.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight; runs on main are
# never cancelled, so every merge keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Rendering checks (notebook blocks, markdown, schemas)
        run: bun run scripts/check-rendering.tsx

      - name: Script checks
        run: |
          bun scripts/check-version.ts
          bun scripts/check-capability-map.ts
          bun scripts/check-mermaid-repair.ts
          bun scripts/check-study-presentation.ts
          bun scripts/check-dev-trace.ts
          bun scripts/check-release.ts

      # Also what produces `dist/`, which `tauri::generate_context!` needs at
      # compile time (so the Rust job below can't run without it).
      - name: Build frontend
        run: bun run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 1

  backend:
    name: Rust tests
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri links against webkit2gtk; Ubuntu runners ship without it.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
