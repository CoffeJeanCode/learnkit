name: CI

# Runs on every PR and every push to main, so a release tag is only ever cut
# from code that already typechecks and passes its tests.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri links against webkit2gtk; Ubuntu runners ship without it.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: Version files agree
        run: bun scripts/check-version.ts

      - name: Release-script logic
        run: bun scripts/check-release.ts

      # `tauri::generate_context!` needs the built frontend (`frontendDist`).
      - name: Typecheck + build the frontend
        run: bun run build

      - name: UI and presentation checks
        run: |
          bun scripts/check-capability-map.ts
          bun scripts/check-study-presentation.ts
          bun scripts/check-rendering.tsx
          bun scripts/check-mermaid-repair.ts

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
